<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - AI Scanner</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>


<body class="auth-page">

<div class="auth-container">

    <div class="auth-brand">

        <div class="brand-icon large">
            AI
        </div>

        <h1>AI SCANNER</h1>

        <p>
            Verify identities.
            <br>
            Build a safer tomorrow.
        </p>

    </div>


    <div class="auth-form-container">

        <div class="auth-form">

            <h2>Welcome Back</h2>

            <p class="auth-subtitle">
                Login to your account
            </p>


            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <div class="form-row">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary full-width"
                >
                    Login
                </button>


                <div
                    id="loginMessage"
                    class="form-message"
                ></div>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </div>

</div>


<script src="js/auth.js"></script>

</body>
</html>
