[project]
name = "ai-document-forgery-detection"
version = "1.0.0"
description = "AI-based document forgery detection and verification system"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "python-multipart",
    "pydantic",
    "email-validator",
    "mysql-connector-python",
    "python-dotenv",
    "numpy",
    "pillow",
    "ai-edge-litert"
]

[tool.vercel]
entrypoint = "backend.main:app"